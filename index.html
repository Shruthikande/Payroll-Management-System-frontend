<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Welcome </h1>
            
            <div class="login-options">
                <div class="option-card">
                    <div class="icon admin-icon">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <h3>Admin Login</h3>
                    <p>Manage employees, process payroll, generate reports</p>
                    <a href="admin-login.html" class="btn">Login as Admin</a>
                </div>
                
                <div class="option-card">
                    <div class="icon employee-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <h3>Employee Login</h3>
                    <p>View payslips, check attendance, update profile</p>
                    <a href="employee-login.html" class="btn">Login as Employee</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Footer -->
    <footer>
        <p>Manage your Payroll &copy; 2024 | Developed by Shruthi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
