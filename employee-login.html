<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Payroll System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
            
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-user-tie"></i>
                </div>
                <h2>Employee Login</h2>
                <p>Enter your employee ID and password to access your portal</p>
            </div>
            
            <form id="employeeLoginForm">
                <div class="form-group">
                    <label for="employeeId"><i class="fas fa-id-card"></i> Employee ID</label>
                    <input type="text" id="employeeId" placeholder="Enter your employee ID" required>
                </div>
                
                <div class="form-group">
                    <label for="employeePassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="employeePassword" placeholder="Enter password" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn login-btn">Login</button>
                
                <div class="demo-credentials">
                    <p><strong>Demo Credentials:</strong></p>
                    <p>Employee ID: <code>EMP001</code></p>
                    <p>Password: <code>emp123</code></p>
                </div>
            </form>
            
            <div class="login-footer">
                <p>Having trouble logging in? <a href="#">Contact HR Department</a></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
